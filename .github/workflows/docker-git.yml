# Publishes a git-sha-tagged image to Docker Hub, `workflow_dispatch` only. Never tags
# `latest`.
#
# The v1.x line built this through `make docker-build-push-git-sha`; upstream dropped the
# Makefile docker targets in the v2.5 line in favour of Depot (gated to paradigmxyz/reth), so
# the buildx invocation lives here instead.

name: docker-git

on:
  workflow_dispatch: {}

env:
  DOCKER_IMAGE_NAME: ultrasoundorg/reth
  BUILD_PLATFORMS: linux/amd64
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # A maxperf reth build needs more room than the runner image leaves free.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: alextes
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA (9 chars)
        run: echo "GIT_SHA=$(echo ${{ github.sha }} | cut -c 1-9)" >> $GITHUB_ENV

      - name: Set up Docker builder
        run: docker buildx create --use --name cross-builder

      - name: Build and push the git-sha-tagged reth image
        run: |
          docker buildx build --file ./Dockerfile . \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BUILD_PROFILE=maxperf \
            --tag ${DOCKER_IMAGE_NAME}:${GIT_SHA} \
            --provenance=false \
            --push
